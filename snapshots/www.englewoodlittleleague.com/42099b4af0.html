<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Sports Connect</title>
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <style type="text/css">
			html, body, table, tr, td, div, img, h2, p { margin: 0; padding: 0; }
			html, body { height: 100%; width: 100%; vertical-align: middle; }
			.logoWrapper img { max-width: 100%; height: 60px;}
			.mpWrapper { width: 100%; height: 100%; }
			.mpContent { width: 40%; border-radius: 8px; background-color: #fff; border: none; padding: 40px; box-shadow: 0px 0px 10px 1px rgb(0 0 0 / 7%); }
			.mpHead { font-family: Arial, Helvetica, sans-serif; color: #304a9a; font-size: 23px; text-transform: uppercase; line-height: 37px; margin: 35px 0; }
			.mpDescription { font-family: Arial, Helvetica, sans-serif; font-weight: normal; color: #818181; font-size: 17px; line-height: 30px; }
			@media screen and (max-width: 1024px) {
				.mpContent { width: 80%; }
			}
			@media screen and (max-width: 767px) {
				.logoWrapper img { height: auto; }
				.mpContent { width: 60%; }
			}
			@media screen and (max-width: 414px) {
				.mpHead { font-size: 22px; line-height: 30px; }
				.mpContent { padding: 30px; }
			}
        </style>
	</head>
	<body>
        <table class="mpWrapper" cellpadding="0" cellspacing="0" border="0">
        	<tr>
            	<td valign="middle" align="center">
                	<div class="mpContent">
			            <div class="logoWrapper">
							<img src="images/sports-connect-logo1.png" alt="BLUE SOMBRERO - Online Registration & Web Design for Youth Sports"/>
						</div>
    	    		    <!--h2 class="mpHead">We'll be right back!</h2-->
						<h2 class="mpHead">Sports Connect is temporarily unavailable for scheduled maintenance.</h2>
						<p class="mpDescription">

						Please check back again at 07:00 AM EST when the system will be back up. <br>

						Thank you for your patience !</p>
					</div>
                </td>
			</tr>
        </table>
	</body>
</html>
